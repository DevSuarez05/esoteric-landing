<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF3B0" />
      <stop offset="60%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#8E6C18" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#D4AF37" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Background celestial dark circle -->
  <circle cx="32" cy="32" r="30" fill="#0B0914" stroke="#D4AF37" stroke-width="2" />

  <!-- Mystic Crescent Moon -->
  <path d="M38 14 C27 14 18 22 18 32 C18 42 27 50 38 50 C33 46 30 39 30 32 C30 25 33 18 38 14 Z" fill="url(#goldGlow)" filter="url(#glow)" />

  <!-- 8-Pointed Astral Star -->
  <path d="M43 23 L44.8 28.5 L50 30 L44.8 31.5 L43 37 L41.2 31.5 L36 30 L41.2 28.5 Z" fill="#00E5FF" />
  
  <!-- Tiny Twinkle Sparkle -->
  <circle cx="25" cy="24" r="1.5" fill="#FFF3B0" />
  <circle cx="28" cy="40" r="1.2" fill="#00E5FF" />
</svg>